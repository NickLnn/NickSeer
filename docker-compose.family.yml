# docker-compose.family.yml
#
# For FAMILY MEMBERS running their own NickSeer instance (or you, on a second
# machine): pulls your PUBLISHED image from GHCR instead of building from
# source. They never see your code or config — just the image + their own
# fresh, empty config folder.
#
# Usage:
#   1. Replace <your-github-username> below.
#   2. docker compose -f docker-compose.family.yml up -d
#   3. Open http://<their-nas-ip>:5056 and run through the first-run wizard
#      with THEIR OWN Plex/TMDB/etc. keys.
#
# If your GitHub repo/package is private, they'll need to `docker login ghcr.io`
# first with a GitHub personal access token that has `read:packages` scope.

services:
  nickseer:
    image: ghcr.io/<your-github-username>/nickseer:latest
    container_name: nickseer
    restart: unless-stopped
    environment:
      - PORT=5056
      - CONFIG_DIR=/config
      - TZ=Europe/Athens
    ports:
      - "5056:5056"
    volumes:
      - ./config:/config    # each person's OWN keys/data live here, locally
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5056/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
