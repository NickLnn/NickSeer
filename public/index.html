<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NickSeer" />
  <meta name="application-name" content="NickSeer" />
  <meta name="theme-color" content="#0a0e17" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>NickSeer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://image.tmdb.org" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=20260830_0236" />
  <link rel="stylesheet" href="/css/enhance.css?v=20260830_0236" />
  <link rel="stylesheet" href="/css/theme.css?v=20260830_0236" />
</head>
<body>
  <div id="ambient" class="ambient"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button id="mobileMenuBtn" class="icon-btn mobile-menu-btn" title="Menu" aria-label="Menu">☰</button>
      <div class="brand" data-nav>
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">NickSeer</span>
      </div>
    </div>
    <nav class="nav-links">
      <button class="nav-link active" data-nav data-view="home">Home</button>
      <button class="nav-link" data-nav data-view="movies">Movies</button>
      <button class="nav-link" data-nav data-view="shows">TV</button>
      <button class="nav-link" data-nav data-view="ai">AI Suggestions</button>
      <button class="nav-link" data-nav data-view="streaming">Streaming</button>
      <button class="nav-link" data-nav data-view="new">New</button>
      <button class="nav-link" data-nav data-view="boxoffice">Box Office</button>
      <button class="nav-link" data-nav data-view="coming">Coming Soon</button>
      <button class="nav-link" data-nav data-view="live">Live Streaming</button>
      <button class="nav-link" data-nav data-view="status">Downloads</button>
      <button class="nav-link" data-nav data-view="info">Info</button>
      <button class="nav-link" data-nav data-view="requests" style="display:none">Requests</button>
    </nav>
    <div class="topbar-right">
      <div class="search-box"><input id="search" type="search" placeholder="Search movies, TV, actors…" data-nav autocomplete="off" /></div>
      <button id="refreshBtn" class="icon-btn" data-nav title="Refresh now" aria-label="Refresh">⟳</button>
      <button id="profileBtn" class="profile-btn" data-nav title="Profile"><span id="profileInitial">N</span></button>
      <button id="settingsBtn" class="icon-btn" data-nav title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <!-- Seerr-style Mobile Navigation Drawer -->
  <div id="drawerOverlay" class="drawer-overlay hidden">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer-panel" id="drawerPanel">
      <div class="drawer-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">NickSeer</span>
        </div>
        <button id="drawerCloseBtn" class="drawer-close" aria-label="Close menu">✕</button>
      </div>
      <div class="drawer-body">
        <div class="drawer-section-title">Discover</div>
        <button class="drawer-item active" data-view="home"><span class="d-ic">🏠</span> Home</button>
        <button class="drawer-item" data-view="movies"><span class="d-ic">🎬</span> Movies</button>
        <button class="drawer-item" data-view="shows"><span class="d-ic">📺</span> TV Shows</button>
        <button class="drawer-item" data-view="ai"><span class="d-ic">✨</span> AI Recommendations</button>
        <button class="drawer-item" data-view="streaming"><span class="d-ic">🍿</span> Streaming Services</button>
        <button class="drawer-item" data-view="new"><span class="d-ic">🆕</span> New Releases</button>
        <button class="drawer-item" data-view="boxoffice"><span class="d-ic">🎟️</span> Box Office Top 10</button>
        <button class="drawer-item" data-view="coming"><span class="d-ic">⏳</span> Coming Soon</button>
        <button class="drawer-item" data-view="live"><span class="d-ic">🔴</span> Live Streaming</button>

        <div class="drawer-section-title">Manage</div>
        <button class="drawer-item" data-view="requests" id="drawerRequestsBtn"><span class="d-ic">📋</span> Requests</button>
        <button class="drawer-item" data-view="status"><span class="d-ic">📥</span> Downloads & Health</button>
        <button class="drawer-item" data-view="info"><span class="d-ic">ℹ️</span> System Info</button>
        <button class="drawer-item" id="drawerSettingsBtn"><span class="d-ic">⚙️</span> Settings</button>
        <button class="drawer-item" id="drawerProfileBtn"><span class="d-ic">👥</span> Switch Profile</button>
      </div>
    </aside>
  </div>

  <main id="app" class="app"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div id="settings" class="settings-overlay hidden"></div>
  <div id="login" class="login-overlay hidden"></div>
  <div id="toasts" class="toasts"></div>

  <!-- Mobile Bottom Navigation (Overseerr / Seerr Style) -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bottom-nav-item active" data-nav data-view="home">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </span>
      <span class="bnav-label">Home</span>
    </button>
    <button class="bottom-nav-item" data-nav data-view="movies">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
      </span>
      <span class="bnav-label">Movies</span>
    </button>
    <button class="bottom-nav-item" data-nav data-view="shows">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
      </span>
      <span class="bnav-label">TV</span>
    </button>
    <button class="bottom-nav-item" data-nav data-view="requests" id="bnavRequests">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      </span>
      <span class="bnav-label">Requests</span>
    </button>
    <button class="bottom-nav-item" data-nav id="bottomMenuBtn">
      <span class="bnav-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="5" r="1.5"></circle><circle cx="12" cy="19" r="1.5"></circle></svg>
      </span>
      <span class="bnav-label">More</span>
    </button>
  </nav>

  <script type="module" src="/js/nav.js?v=20260830_0236"></script>
  <script type="module" src="/js/settings.js?v=20260830_0236"></script>
  <script type="module" src="/js/app.js?v=20260830_0236"></script>
  <script type="module" src="/js/collections.js?v=20260830_0236"></script>
  <script type="module" src="/js/logo.js?v=20260830_0236"></script>
  <script type="module" src="/js/brands.js?v=20260830_0236"></script>
  <script type="module" src="/js/menu.js?v=20260830_0236"></script>
  <script type="module" src="/js/plexcard.js?v=20260830_0236"></script>
  <script type="module" src="/js/stats.js?v=20260830_0236"></script>
  <script type="module" src="/js/live.js?v=20260830_0236"></script>
  <script type="module" src="/js/info.js?v=20260830_0236"></script>
  <script type="module" src="/js/settings-ai.js?v=20260830_0236"></script>
  <script type="module" src="/js/settings-tuning.js?v=20260830_0236"></script>
  <script type="module" src="/js/aisuggest.js?v=20260830_0236"></script>
  <script type="module" src="/js/buttons.js?v=20260830_0236"></script>
  <script type="module" src="/js/approvals.js?v=20260830_0236"></script>
  <script type="module" src="/js/roles.js?v=20260830_0236"></script>
  <script type="module" src="/js/imdb-badge.js?v=20260830_0236"></script>
  <script type="module" src="/js/fixes.js?v=20260830_0236"></script>
  <script type="module" src="/js/login-enhance.js?v=20260830_0236"></script>

  <!-- Mobile Bottom Navigation Bar -->
  

  
</body>
</html>
